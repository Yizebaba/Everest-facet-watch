services:
  web:
    image: nginx:1.27-alpine
    container_name: facet-watch-realtime-web
    ports:
      - "8001:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./data:/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  monitor:
    build: ./monitor
    image: facet-watch-monitor:local
    container_name: facet-watch-realtime-monitor
    environment:
      FACET_WATCH_CONFIG: /app/config/monitor.json
      FACET_WATCH_HIMALAYA_ASSET_ROOT: ${FACET_WATCH_HIMALAYA_ASSET_ROOT:-}
      HOME: /app/secrets
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./secrets:/app/secrets
      - ./web:/app/web:ro
    restart: unless-stopped
