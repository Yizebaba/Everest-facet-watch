<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facet Watch 冰川陡坡面监测</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p.desc {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            display: block;
            text-decoration: none;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 8px;
            transition: all 0.2s ease;
            color: inherit;
        }
        .card:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }
        .card h2 {
            font-size: 18px;
            margin: 0 0 6px 0;
            color: #f8fafc;
        }
        .card p {
            margin: 0;
            font-size: 13px;
            color: #94a3b8;
        }
        .tag {
            display: inline-block;
            background: #0284c7;
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Facet Watch 冰川陡坡面监测</h1>
        <p class="desc">基于 Sentinel-1 合成孔径雷达（SAR）时间序列异常分析的研究型陡冰坡面监测系统。</p>
        <div class="cards">
            <a class="card" href="/himalaya/">
                <span class="tag">Sentinel-1 SAR</span>
                <h2>喜马拉雅监测 (Himalaya Facet Watch) &rarr;</h2>
                <p>覆盖喜马拉雅全域冰川陡坡面的异常状态筛查地图与分析工具。</p>
            </a>
            <a class="card" href="/langtang/">
                <span class="tag">Sentinel-1 SAR</span>
                <h2>朗塘监测 (Langtang Facet Watch) &rarr;</h2>
                <p>朗塘流域（Langtang）精细坡面候选点监测与前兆时序图表。</p>
            </a>
        </div>
    </div>
<div style="text-align:center;padding:16px;font-size:13px;color:#94a3b8;border-top:1px solid #334155;margin-top:24px;">vx:No1-Shine ｜ 珠峰自然环境信息监控系统［测试版］</div>
</body>
</html>
